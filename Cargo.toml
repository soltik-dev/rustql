[package]
name = "rustql"
version = "0.1.0"
edition = "2024"
# Required by egui 0.37, the most demanding dependency.
rust-version = "1.95"
description = "A fast, native client for MySQL, MariaDB and PostgreSQL"
license = "GPL-3.0-or-later"
repository = "https://github.com/soltik-dev/rustql"
homepage = "https://rustql.com"
# An application, not a library: never published to crates.io.
publish = false

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
# TLS de los dos motores en Rust puro (rustls + ring): sin openssl, para el
# build portable con glibc antigua, igual que el llavero.
mysql = { version = "28", features = ["rustls-tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Autoridades para verificar el certificado del servidor: las instaladas en
# el sistema (donde estará la de una empresa) y, por si el sistema no trae
# ninguna, las públicas de Mozilla (las mismas que usa el crate de MySQL).
rustls-native-certs = "0.8"
webpki-roots = "1"
# Para pasarle al crate de MySQL las del sistema, que solo admite un fichero PEM
base64 = "0.22"
# `std` explícito: en Linux lo activa de rebote el llavero, pero en Windows y
# macOS nadie, y sin él no existen los streams con concurrencia (`buffered`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
dark-light = "3"
arboard = "3"
chrono = "0.4"
rfd = "0.17"
env_logger = "0.11"
log = "0.4"
keyring-core = "1"

# Almacén de contraseñas del sistema (ver src/secrets.rs). Solo Rust puro en
# Linux: sin libdbus ni openssl, para el build portable con glibc antigua.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
