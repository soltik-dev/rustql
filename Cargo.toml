[package]
name = "rustql"
version = "0.1.0"
edition = "2024"
# Required by egui 0.37, the most demanding dependency.
rust-version = "1.95"
description = "A fast, native client for MySQL, MariaDB and PostgreSQL"
license = "GPL-3.0-or-later"
repository = "https://github.com/soltik-dev/rustql"
homepage = "https://rustql.com"
# An application, not a library: never published to crates.io.
publish = false

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
# TLS for both engines in pure Rust (rustls + ring): no openssl, for the
# portable build with an old glibc, like the keyring.
mysql = { version = "28", features = ["rustls-tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Authorities to verify the server certificate: those installed on the
# system (where a company's own will be) and, in case the system has none,
# Mozilla's public ones (the same the MySQL crate uses).
rustls-native-certs = "0.8"
webpki-roots = "1"
# To hand the system ones to the MySQL crate, which only accepts one PEM file
base64 = "0.22"
# Explicit `std`: on Linux the keyring enables it indirectly, but on Windows
# and macOS nothing does, and without it the concurrent streams (`buffered`)
# do not exist.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
dark-light = "3"
arboard = "3"
chrono = "0.4"
rfd = "0.17"
env_logger = "0.11"
log = "0.4"
keyring-core = "1"

# System password store (see src/secrets.rs). Pure Rust only on Linux: no
# libdbus or openssl, for the portable build with an old glibc.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

# The packages ship the binary without its symbol table: a quarter smaller,
# and panic messages keep their file and line.
[profile.release]
strip = true

# Icon and version details of rustql.exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Debian package (`cargo deb --no-build`), made by the release workflow from
# the portable Linux binary. Graphics and windowing libraries are loaded at
# run time and every desktop has them, so only libc and zlib are listed.
[package.metadata.deb]
maintainer = "Alberto López <1663315+dukerth@users.noreply.github.com>"
copyright = "2026, Alberto López"
license-file = ["LICENSE", "0"]
extended-description = """\
RustQL is a desktop client for MySQL, MariaDB and PostgreSQL written in Rust. \
It starts instantly, stays responsive with large tables and keeps your \
passwords in the system keyring."""
section = "database"
priority = "optional"
depends = "libc6 (>= 2.28), zlib1g"
assets = [
    ["target/release/rustql", "usr/bin/", "755"],
    ["packaging/linux/com.rustql.RustQL.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/com.rustql.RustQL.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/icon/icon.png", "usr/share/icons/hicolor/256x256/apps/com.rustql.RustQL.png", "644"],
    ["README.md", "usr/share/doc/rustql/", "644"],
]
