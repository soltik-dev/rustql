name: CI

# On pull requests: the main branch ruleset requires these jobs to pass and
# the PR to be up to date with main, so what gets merged is exactly what was
# tested. Running again on the merge commit would only repeat it.
# Manually (workflow_dispatch) to test a branch without opening a PR.
on:
  pull_request:
  workflow_dispatch:

# A new push to the PR (or branch) cancels the previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, clippy and every test, including the integration tests.
  linux:
    runs-on: ubuntu-24.04
    # Inside a container to run as root: the integration tests install and
    # start throwaway MariaDB and PostgreSQL servers in it.
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config zlib1g-dev

      - uses: actions/checkout@v5

      # egui 0.37 needs Rust ≥ 1.95 (rust-version in Cargo.toml).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # The #[ignore] tests use real servers (RUSTQL_TEST_MYSQL and
      # RUSTQL_TEST_POSTGRES, over TLS), started as throwaway instances inside
      # the container itself.
      - name: Integration tests (MariaDB and PostgreSQL)
        run: |
          # Without the cluster the PostgreSQL package creates and starts on its own
          apt-get install -y --no-install-recommends postgresql-common openssl
          sed -i 's/^#\?create_main_cluster.*/create_main_cluster = false/' \
            /etc/postgresql-common/createcluster.conf
          apt-get install -y --no-install-recommends \
            mariadb-server mariadb-client postgresql

          # Certificate for both servers, signed by a private CA and valid for
          # 127.0.0.1: the TLS tests check that it verifies with that CA and is
          # rejected without it
          tls="$(mktemp -d /tmp/rustql-tls.XXXXXX)"
          openssl req -new -x509 -days 2 -nodes -subj "/CN=RustQL CI CA" \
            -keyout "$tls/ca.key" -out "$tls/ca.crt" 2> /dev/null
          openssl req -new -nodes -subj "/CN=rustql-ci" \
            -keyout "$tls/server.key" -out "$tls/server.csr" 2> /dev/null
          printf 'subjectAltName=IP:127.0.0.1\nbasicConstraints=CA:FALSE\n' > "$tls/ext.cnf"
          openssl x509 -req -in "$tls/server.csr" -CA "$tls/ca.crt" -CAkey "$tls/ca.key" \
            -CAcreateserial -days 2 -extfile "$tls/ext.cnf" -out "$tls/server.crt" 2> /dev/null
          chmod 755 "$tls" && chmod 644 "$tls"/*

          data="$RUNNER_TEMP/mariadb"
          mariadb-install-db --no-defaults --user=root --datadir="$data" \
            --auth-root-authentication-method=normal --skip-test-db > /dev/null
          mariadbd --no-defaults --user=root --datadir="$data" --socket="$data.sock" \
            --port=33306 --bind-address=127.0.0.1 --skip-name-resolve \
            --ssl-cert="$tls/server.crt" --ssl-key="$tls/server.key" &
          for _ in $(seq 30); do
            [ -S "$data.sock" ] && break
            sleep 1
          done
          mariadb --no-defaults --skip-ssl -S "$data.sock" -uroot \
            -e "CREATE USER 'ci'@'127.0.0.1' IDENTIFIED BY 'ci'; GRANT ALL ON *.* TO 'ci'@'127.0.0.1';"

          # PostgreSQL refuses to run as root: it runs as the package's user,
          # in its own cluster and on another port (when the CI runs locally
          # with act_runner the container shares the host network, where 5432
          # may be taken).
          pg="$(mktemp -d /tmp/rustql-pg.XXXXXX)"
          chown postgres "$pg"
          su postgres -c "
            set -e
            export PATH=\"\$(echo /usr/lib/postgresql/*/bin):\$PATH\"
            echo ci > $pg/password
            initdb -D $pg/data -U ci --pwfile=$pg/password --auth=scram-sha-256 > /dev/null
            cp $tls/server.crt $tls/server.key $pg/data/
            chmod 600 $pg/data/server.key
            pg_ctl -D $pg/data -l $pg/log -w start \\
              -o '-p 55432 -c listen_addresses=127.0.0.1 -c unix_socket_directories=$pg -c ssl=on'
          "

          RUSTQL_TEST_CA="$tls/ca.crt" \
          RUSTQL_TEST_MYSQL='ci:ci@127.0.0.1:33306' \
          RUSTQL_TEST_POSTGRES='ci:ci@127.0.0.1:55432' \
            cargo test --locked -- --ignored --skip secrets

  # Windows and macOS: build without warnings and pass the unit tests.
  # There are no test servers or unlocked keyring here.
  other:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked -- --skip secrets
